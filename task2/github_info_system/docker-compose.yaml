version: '3.8'

services:
  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    ports:
      - "50051:50051"
    environment:
      - COLLECTOR_PORT=50051
    networks:
      - github-info-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - COLLECTOR_ADDR=collector:50051
    depends_on:
      - collector
    networks:
      - github-info-network
    restart: unless-stopped

networks:
  github-info-network:
    driver: bridge
